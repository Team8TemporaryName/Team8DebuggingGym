<svg xmlns="http://www.w3.org/2000/svg" width="980" height="440" viewBox="0 0 980 440" font-family="Arial, Helvetica, sans-serif" font-size="13">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#555"/>
    </marker>
    <style>
      .container { fill:#e8f0fe; stroke:#1a73e8; stroke-width:1.5; rx:6; }
      .external { fill:#f1f3f4; stroke:#5f6368; stroke-width:1.5; stroke-dasharray:6 4; rx:6; }
      .label { fill:#202124; }
      .text { fill:#202124; font-size:12px; }
      .edge { stroke:#555; stroke-width:1.5; fill:none; }
      .legend { font-size:12px; fill:#202124; }
    </style>
  </defs>

  <!-- legend -->
  <rect x="12" y="10" width="16" height="16" rx="4" class="container"/>
  <text x="34" y="24" class="legend">product container or data store</text>
  <rect x="12" y="34" width="16" height="16" rx="4" class="external"/>
  <text x="34" y="48" class="legend">external actor or system</text>
  <line x1="12" y1="62" x2="28" y2="62" class="edge" marker-end="url(#arrow)"/>
  <text x="34" y="66" class="legend">exchange (labelled with protocol)</text>
  <text x="12" y="88" class="legend">OpenPanel and OpenObserve are self-hosted external systems; the team deploys/configures them but does not build them.</text>

  <!-- learner browser -->
  <rect x="20" y="165" width="140" height="50" class="external"/>
  <text x="90" y="194" text-anchor="middle" class="label">learner (browser)</text>

  <!-- webapp -->
  <rect x="290" y="165" width="180" height="50" class="container"/>
  <text x="380" y="194" text-anchor="middle" class="label">webapp</text>
  <text x="380" y="208" text-anchor="middle" class="text">(FastAPI)</text>

  <!-- database -->
  <rect x="560" y="105" width="150" height="50" class="container"/>
  <text x="635" y="134" text-anchor="middle" class="label">database</text>
  <text x="635" y="148" text-anchor="middle" class="text">(SQLite)</text>

  <!-- OpenPanel external self-hosted backend -->
  <rect x="790" y="125" width="175" height="50" class="external"/>
  <text x="877" y="154" text-anchor="middle" class="label">OpenPanel</text>

  <!-- OpenObserve external self-hosted backend -->
  <rect x="790" y="250" width="175" height="50" class="external"/>
  <text x="877" y="279" text-anchor="middle" class="label">OpenObserve</text>

  <!-- VS Code and extension -->
  <rect x="20" y="340" width="160" height="50" class="external"/>
  <text x="100" y="369" text-anchor="middle" class="label">learner's VS Code</text>
  <rect x="290" y="255" width="180" height="50" class="container"/>
  <text x="380" y="284" text-anchor="middle" class="label">vscode-extension</text>

  <!-- runtime and LLM provider -->
  <rect x="290" y="350" width="180" height="50" class="container"/>
  <text x="380" y="379" text-anchor="middle" class="label">debug-runtime</text>
  <text x="380" y="393" text-anchor="middle" class="text">(debugpy)</text>
  <rect x="560" y="350" width="150" height="50" class="external"/>
  <text x="635" y="379" text-anchor="middle" class="label">LLM provider</text>

  <!-- edges -->
  <line x1="160" y1="190" x2="288" y2="190" class="edge" marker-end="url(#arrow)"/>
  <text x="224" y="181" text-anchor="middle" class="text">HTTPS</text>

  <line x1="100" y1="340" x2="288" y2="375" class="edge" marker-end="url(#arrow)"/>
  <text x="195" y="350" text-anchor="middle" class="text">DAP</text>

  <line x1="380" y1="215" x2="380" y2="253" class="edge" marker-end="url(#arrow)"/>
  <text x="430" y="240" text-anchor="middle" class="text">HTTPS</text>

  <line x1="380" y1="305" x2="380" y2="348" class="edge" marker-end="url(#arrow)"/>
  <text x="440" y="330" text-anchor="middle" class="text">runs per session</text>

  <line x1="470" y1="170" x2="558" y2="140" class="edge" marker-end="url(#arrow)"/>
  <text x="510" y="145" text-anchor="middle" class="text">SQL</text>

  <line x1="470" y1="180" x2="788" y2="150" class="edge" marker-end="url(#arrow)"/>
  <text x="630" y="155" text-anchor="middle" class="text">HTTPS tracking API</text>

  <line x1="470" y1="205" x2="788" y2="270" class="edge" marker-end="url(#arrow)"/>
  <text x="626" y="245" text-anchor="middle" class="text">OTLP/HTTP</text>

  <line x1="560" y1="375" x2="472" y2="375" class="edge" marker-end="url(#arrow)"/>
  <text x="516" y="365" text-anchor="middle" class="text">REST/API</text>
</svg>
