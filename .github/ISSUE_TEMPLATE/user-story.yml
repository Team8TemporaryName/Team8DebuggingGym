name: User story
description: A user need with acceptance criteria, traceable to a value proposition.
title: "US-00: <need>"
body:
  - type: markdown
    attributes:
      value: |
        ## User story

        A need from a named user, written so a stranger could check it, with
        acceptance criteria somebody else can run and a MoSCoW priority.

  - type: input
    id: summary
    attributes:
      label: Summary
      description: One sentence naming the user and the need they want met.
      placeholder: "As a <user>, I want <capability> so that <benefit>."
    validations:
      required: true

  - type: input
    id: value-proposition
    attributes:
      label: Value proposition
      description: The VP-nn this story supports.
    validations:
      required: true

  - type: textarea
    id: traces-to
    attributes:
      label: Traces to
      description: The GAP-nn, VP-nn, or action point this story originates from.
      value: |
        - 
    validations:
      required: false

  - type: textarea
    id: rests-on
    attributes:
      label: Rests on
      description: The ASM-nn assumptions this story rests on.
      value: |
        - 
    validations:
      required: false

  - type: textarea
    id: acceptance-criteria
    attributes:
      label: Acceptance criteria
      description: "AC-nn criteria somebody else can run, each starting with its AC-nn. Each must be observable and pass/fail."
      value: |
        - [ ] AC-01:
        - [ ] AC-02:
    validations:
      required: true

  - type: textarea
    id: priority-reason
    attributes:
      label: Priority reason
      description: >
        Why this priority rather than the one above or below it.
        Link a CON-nn when a constraint drives it.
        Set the MoSCoW issue field after creating the issue; do not use a label.
      placeholder: "Must Have: without it, the core task does not complete; a neighbouring story is Should/Could because ..."
    validations:
      required: true

  - type: textarea
    id: specified-by
    attributes:
      label: Specified by
      description: >
        The FR-nnn and ADR-nnn that specify this story.
        Use full links to files on main, one per line.
      value: |
        -
    validations:
      required: false