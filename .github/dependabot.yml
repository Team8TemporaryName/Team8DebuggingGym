version: 2

updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    # Group all action bumps into one pull request to keep history tidy.
    groups:
      actions:
        patterns:
          - "*"
    commit-message:
      prefix: ci
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    # Group dependency bumps into one pull request per week.
    groups:
      python:
        patterns:
          - "*"
    commit-message:
      prefix: deps