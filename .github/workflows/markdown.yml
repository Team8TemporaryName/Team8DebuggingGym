name: Markdown check

# Runs on every pull request and on every push to main. Fails the build on
# Markdown style violations found by markdownlint-cli2.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  markdownlint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Run markdownlint-cli2
        uses: DavidAnson/markdownlint-cli2-action@5b7c9f74fec47e6b15667b2cc23c63dff11e449e # v9.0.0
        with:
          # The .markdownlint-cli2.jsonc file at the repo root is discovered
          # automatically; only the globs to check are passed here.
          globs: "**/*.md"